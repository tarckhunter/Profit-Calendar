<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12-Month Profit Calendar</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --win-bg: rgba(16, 185, 129, 0.18);
      --win-text: #34d399;
      --loss-bg: rgba(239, 68, 68, 0.18);
      --loss-text: #f87171;
      --flat-bg: rgba(148, 163, 184, 0.12);
      --flat-text: #cbd5e1;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); }
    
    .header { max-width: 1440px; margin: 0 auto 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
    .header h1 { margin: 0; font-size: 1.5rem; }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    select, button { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
    button:hover { background: #2d3b52; }
    .sync-status { font-size: 0.82rem; color: var(--muted); }

    /* สไตล์สวิตช์เลือกโหมดแสดงเดือน */
    .switch-group { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .25s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .25s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(18px); }
    
    .stats-bar { max-width: 1440px; margin: 0 auto 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .stat-box { background: var(--card); border: 1px solid var(--border); padding: 16px; border-radius: 12px; }
    .stat-label { font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    .stat-value { font-size: 1.4rem; font-weight: 700; }

    .calendar-grid { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    /* ปรับขนาดช่องให้ดูสวยเต็มตาเมื่อแสดงเดือนเดียว */
    .calendar-grid.single-view { max-width: 820px; grid-template-columns: 1fr; }
    .calendar-grid.single-view .day-cell { min-height: 76px; padding: 8px 6px; }
    .calendar-grid.single-view .day-num { font-size: 0.85rem; }
    .calendar-grid.single-view .day-pnl { font-size: 0.95rem; }

    .month-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .month-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .month-title { font-weight: 700; font-size: 1.1rem; }
    .month-total { font-weight: 600; font-size: 0.95rem; }

    .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .weekdays div { font-size: 0.75rem; color: var(--muted); padding-bottom: 6px; font-weight: 600; }
    .day-cell { min-height: 48px; background: rgba(15, 23, 42, 0.5); border-radius: 6px; padding: 4px 2px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid transparent; transition: all 0.2s ease; }
    .day-cell.empty { background: transparent; }
    .day-num { font-size: 0.72rem; color: var(--muted); text-align: right; padding-right: 4px; }
    .day-pnl { font-size: 0.75rem; font-weight: 700; word-break: break-all; }

    .win { background: var(--win-bg); border-color: rgba(52, 211, 153, 0.3); }
    .win .day-pnl, .text-win { color: var(--win-text); }
    .loss { background: var(--loss-bg); border-color: rgba(248, 113, 113, 0.3); }
    .loss .day-pnl, .text-loss { color: var(--loss-text); }
    .flat { background: var(--flat-bg); border-color: rgba(148, 163, 184, 0.25); }
    .flat .day-pnl { color: var(--flat-text); }

    #loader { text-align: center; padding: 40px; color: var(--muted); font-size: 1.1rem; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📊 Profit Calendar</h1>
    <div class="controls">
      <span class="sync-status" id="syncStatus">กำลังเชื่อมต่อ...</span>

      <!-- สวิตช์สลับโหมด: เปิด = แสดงเดือนเดียว / ปิด = แสดงทั้ง 12 เดือน -->
      <div class="switch-group">
        <label class="switch">
          <input type="checkbox" id="singleMonthToggle" checked onchange="toggleMonthMode()">
          <span class="slider"></span>
        </label>
        <span style="font-size: 0.9rem; color: var(--text);">เฉพาะเดือนเดียว</span>
      </div>

      <!-- ตัวเลือกเดือน (แสดงเมื่อเปิดสวิตช์เฉพาะเดือนเดียว) -->
      <select id="monthSelect" onchange="renderCalendar()"></select>

      <label for="yearSelect" style="color: var(--muted); font-size: 0.9rem;">ปี (Year):</label>
      <select id="yearSelect" onchange="renderCalendar()"></select>
      <button onclick="fetchData(false)">🔄 รีเฟรชทันที</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-box">
      <div class="stat-label">กำไร/ขาดทุนสุทธิทั้งปี (Net P&L)</div>
      <div class="stat-value" id="yearlyNet">0.00</div>
    </div>
    <div class="stat-box">
      <div class="stat-label" id="currentMonthLabel">กำไรเดือนนี้ (Current Month)</div>
      <div class="stat-value" id="currentMonthNet">0.00</div>
    </div>
    <div class="stat-box">
      <div class="stat-label" id="todayLabel">กำไรวันนี้ (Today P&L)</div>
      <div class="stat-value" id="todayNet">0.00</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">อัตราชนะรายวัน (Win Rate)</div>
      <div class="stat-value" id="winRate">0%</div>
    </div>
  </div>

  <div id="loader">กำลังโหลดข้อมูลจาก Profit Calendar...</div>
  <div class="calendar-grid" id="calendarGrid"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwYSWwNeQnazJw3OUuyq4rqix8i1aXxtFrggvO6rvUy3MhegC5p0wwmjhDd7Mr-oA28/exec";

    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const WEEKDAYS = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
    let sheetData = {};
    let isFirstLoad = true;

    function initYearSelector() {
      const select = document.getElementById("yearSelect");
      const now = new Date(); // ใช้เวลาปัจจุบันตรง ๆ (ตัดวันหลัง 23:59 น.)
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();

      for (let y = 2026; y <= 2036; y++) {
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        if (y === currentYear) opt.selected = true;
        select.appendChild(opt);
      }

      // สร้างตัวเลือกเดือน (ค่าเริ่มต้นเป็นเดือนล่าสุด)
      const monthSelect = document.getElementById("monthSelect");
      MONTHS.forEach((mName, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = mName;
        if (idx === currentMonth) opt.selected = true;
        monthSelect.appendChild(opt);
      });
    }

    function toggleMonthMode() {
      const isSingle = document.getElementById("singleMonthToggle").checked;
      document.getElementById("monthSelect").style.display = isSingle ? "inline-block" : "none";
      renderCalendar();
    }

    async function fetchData(isBackground = false) {
      const loader = document.getElementById("loader");
      const statusEl = document.getElementById("syncStatus");

      if (!isBackground && isFirstLoad) {
        loader.style.display = "block";
      }
      statusEl.textContent = "⏳ กำลังซิงค์...";

      try {
        const noCacheUrl = `${API_URL}?t=${Date.now()}`;
        const response = await fetch(noCacheUrl);
        sheetData = await response.json();

        loader.style.display = "none";
        isFirstLoad = false;
        renderCalendar();

        const nowTime = new Date().toLocaleTimeString("th-TH");
        statusEl.textContent = `🟢 อัปเดตล่าสุด: ${nowTime}`;
      } catch (error) {
        if (isFirstLoad) {
          loader.innerHTML = "❌ โหลดข้อมูลไม่สำเร็จ กรุณาตรวจสอบ URL ของ Web App หรือสิทธิ์การเข้าถึง (Anyone)";
        }
        statusEl.textContent = "🔴 ซิงค์ไม่สำเร็จ (จะลองใหม่ใน 15 วิ)";
        console.error(error);
      }
    }

    function formatNum(num) {
      const sign = num > 0 ? "+" : "";
      return sign + num.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderCalendar() {
      const selectedYear = parseInt(document.getElementById("yearSelect").value);
      const isSingleMode = document.getElementById("singleMonthToggle").checked;
      const selectedMonthIndex = parseInt(document.getElementById("monthSelect").value);

      const now = new Date(); // ใช้เวลาปัจจุบันตรง ๆ (ตัดวันหลัง 23:59 น.)
      const currentMonthIndex = now.getMonth();
      const actualCurrentYear = now.getFullYear();
      
      // สร้าง Key ของวันที่ปัจจุบัน
      const todayKey = `${actualCurrentYear}-${String(currentMonthIndex + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      const todayMonthName = MONTHS[currentMonthIndex];

      const grid = document.getElementById("calendarGrid");
      grid.innerHTML = "";
      grid.className = isSingleMode ? "calendar-grid single-view" : "calendar-grid";

      let yearlyTotal = 0;
      let currentMonthTotal = 0;
      let totalWins = 0;
      let totalLosses = 0;

      MONTHS.forEach((monthName, monthIndex) => {
        const monthMap = sheetData[monthName] || {};
        const firstDay = new Date(selectedYear, monthIndex, 1).getDay();
        const daysInMonth = new Date(selectedYear, monthIndex + 1, 0).getDate();

        let monthTotal = 0;
        let daysHTML = "";

        for (let i = 0; i < firstDay; i++) {
          daysHTML += `<div class="day-cell empty"></div>`;
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const mm = String(monthIndex + 1).padStart(2, "0");
          const dd = String(day).padStart(2, "0");
          const dateKey = `${selectedYear}-${mm}-${dd}`;

          const val = monthMap[dateKey];
          let statusClass = "";
          let pnlText = "-";

          if (val !== undefined) {
            monthTotal += val;
            yearlyTotal += val;
            pnlText = formatNum(val);

            if (val > 0) {
              statusClass = "win";
              totalWins++;
            } else if (val < 0) {
              statusClass = "loss";
              totalLosses++;
            } else {
              statusClass = "flat";
            }
          }

          daysHTML += `
            <div class="day-cell ${statusClass}" title="${dateKey}: ${pnlText}">
              <div class="day-num">${day}</div>
              <div class="day-pnl">${pnlText}</div>
            </div>
          `;
        }

        if (monthIndex === currentMonthIndex) {
          currentMonthTotal = monthTotal;
        }

        // แสดงการ์ดเดือนเฉพาะที่เลือก (ถ้าเปิดโหมดเดือนเดียว) หรือแสดงทั้งหมด (ถ้าปิดสวิตช์)
        if (!isSingleMode || monthIndex === selectedMonthIndex) {
          const monthColorClass = monthTotal > 0 ? "text-win" : (monthTotal < 0 ? "text-loss" : "");

          const cardHTML = `
            <div class="month-card">
              <div class="month-header">
                <span class="month-title">${monthName} ${selectedYear}</span>
                <span class="month-total ${monthColorClass}">${formatNum(monthTotal)}</span>
              </div>
              <div class="weekdays">
                ${WEEKDAYS.map(d => `<div>${d}</div>`).join("")}
              </div>
              <div class="days">
                ${daysHTML}
              </div>
            </div>
          `;
          grid.insertAdjacentHTML("beforeend", cardHTML);
        }
      });

      // ดึงยอดกำไร/ขาดทุนของวันนี้
      const todayVal = (sheetData[todayMonthName] && sheetData[todayMonthName][todayKey] !== undefined) 
        ? sheetData[todayMonthName][todayKey] 
        : 0;

      // อัปเดตกล่องสรุปทั้งปี
      const netEl = document.getElementById("yearlyNet");
      netEl.textContent = formatNum(yearlyTotal);
      netEl.className = "stat-value " + (yearlyTotal > 0 ? "text-win" : (yearlyTotal < 0 ? "text-loss" : ""));

      // อัปเดตกล่องกำไรเดือนนี้
      document.getElementById("currentMonthLabel").textContent = `กำไรเดือนนี้ (${MONTHS[currentMonthIndex]} ${selectedYear})`;
      const cmEl = document.getElementById("currentMonthNet");
      cmEl.textContent = formatNum(currentMonthTotal);
      cmEl.className = "stat-value " + (currentMonthTotal > 0 ? "text-win" : (currentMonthTotal < 0 ? "text-loss" : ""));

      // อัปเดตกล่องกำไรวันนี้
      document.getElementById("todayLabel").textContent = `กำไรวันนี้ (${todayKey})`;
      const tdEl = document.getElementById("todayNet");
      tdEl.textContent = formatNum(todayVal);
      tdEl.className = "stat-value " + (todayVal > 0 ? "text-win" : (todayVal < 0 ? "text-loss" : ""));

      // อัปเดต Win Rate
      const totalActiveDays = totalWins + totalLosses;
      const winRate = totalActiveDays > 0 ? ((totalWins / totalActiveDays) * 100).toFixed(1) : 0;
      document.getElementById("winRate").textContent = `${winRate}%`;
    }

    initYearSelector();
    fetchData(false);

    // อัปเดตอัตโนมัติทุกๆ 15 วินาที
    setInterval(() => fetchData(true), 15000);
  </script>
</body>
</html>
